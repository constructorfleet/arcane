name: Release Arcane to Harbor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcane-release-main
  cancel-in-progress: false
jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.release.outputs.registry }}
      repository: ${{ steps.release.outputs.repository }}
      version: ${{ steps.release.outputs.version }}
      platforms: ${{ steps.release.outputs.platforms }}
      provenance: ${{ steps.release.outputs.provenance }}
      build_time: ${{ steps.release.outputs.build_time }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release identity
        id: release
        env:
          GITEA_SERVER_URL: https://gitea.home.prettybaked.com
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_SHA: ${{ github.sha }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/ci/release.py metadata
  publish:
    name: Build and publish ${{ matrix.image }}
    needs: metadata
    if: needs.metadata.outputs.published != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: manager
            dockerfile: docker/Dockerfile
          - image: agent
            dockerfile: docker/Dockerfile-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.metadata.outputs.registry }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build immutable release images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ needs.metadata.outputs.platforms }}
          push: true
          provenance: ${{ needs.metadata.outputs.provenance }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ needs.metadata.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=https://gitea.home.prettybaked.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          tags: |
            ${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.repository }}-${{ matrix.image }}:${{ needs.metadata.outputs.version }}
            ${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.repository }}-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.repository }}-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.repository }}-${{ matrix.image }}:buildcache,mode=max
  release:
    name: Publish release and promote latest
    needs: [metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GITEA_SERVER_URL: https://gitea.home.prettybaked.com
      GITEA_REPOSITORY: ${{ github.repository }}
      GITEA_SHA: ${{ github.sha }}
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      IMAGE_BASE: ${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.metadata.outputs.registry }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Resolve exact image digests and prepare release
        run: |
          manager_digest=$(docker buildx imagetools inspect "$IMAGE_BASE-manager:sha-$GITEA_SHA" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          agent_digest=$(docker buildx imagetools inspect "$IMAGE_BASE-agent:sha-$GITEA_SHA" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "MANAGER_DIGEST=$manager_digest" >> "$GITHUB_ENV"
          echo "AGENT_DIGEST=$agent_digest" >> "$GITHUB_ENV"
          python3 scripts/ci/release.py draft --manager-digest "$manager_digest" --agent-digest "$agent_digest"
      - name: Check latest ownership
        id: promotion
        run: python3 scripts/ci/release.py promotion
      - name: Promote both images after both builds succeed
        if: steps.promotion.outputs.latest == 'true'
        run: |
          docker buildx imagetools create --tag "$IMAGE_BASE-manager:latest" "$IMAGE_BASE-manager@$MANAGER_DIGEST"
          docker buildx imagetools create --tag "$IMAGE_BASE-agent:latest" "$IMAGE_BASE-agent@$AGENT_DIGEST"
      - name: Publish Gitea release
        run: python3 scripts/ci/release.py publish
